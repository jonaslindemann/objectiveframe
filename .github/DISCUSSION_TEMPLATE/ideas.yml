title: "[Idea]: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Share ideas for examples, teaching material, workflows, or future ObjectiveFrame development.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Example model
        - Student exercise
        - Documentation
        - Video/demo
        - User interface
        - Solver/results
        - Scripting/plugins
        - Platform support
        - Other
  - type: textarea
    id: material
    attributes:
      label: Supporting material
      description: Links, screenshots, sketches, or related references.
